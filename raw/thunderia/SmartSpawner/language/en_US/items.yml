# Configuration version – do not modify this value
language_version: 1.6.6

# SmartSpawner – items.yml
# Spawner item display names and drop item names.
# Small-caps placeholders (e.g. {ᴇɴᴛɪᴛʏ}) are auto-converted in-game.

custom_item:
  # Appearance of smart spawner items in inventory and tooltips
  spawner:
    name: '&#F7B919☄ Spawner de {entity} ☄'
    loot_items: ' &8● &f{amount} {item_name} &7({chance}%)'
    loot_items_empty: '  &#ecf0f1•  ɴᴏɴᴇ'
    lore:
    - ''
    - '&8ᴅᴇᴛᴀɪʟꜱ:'
    - ' &8● &fExperiencia: &e{exp}xp'
    - ''
    - '&8ᴅʀᴏᴘꜱ:'
    - '{loot_items}'
    - ''
    - '&7▶ Colocalo en el suelo'
  
  # Appearance of item spawner items in inventory and tooltips
  item_spawner:
    name: '&#F7B919ꜱᴘᴀᴡɴᴇʀ ᴅᴇ {ᴇɴᴛɪᴛʏ}'
    loot_items: '  &#ecf0f1•  {amount} {item_name} &7({chance}%)'
    loot_items_empty: '  &#ecf0f1•  ɴᴏɴᴇ'
    lore:
    - ''
    - '&#F7B919◈ ᴅᴇᴛᴀɪʟꜱ:'
    - '  &#ecf0f1•  ᴇxᴘᴇʀɪᴇɴᴄᴇ ɢɪᴠᴇ: &#3498db{exp}'
    - ''
    - '&#F7B919◈ bᴅʀᴏᴘꜱ:'
    - '{loot_items}'
    - ''
  
  # Appearance of vanilla spawner items in inventory and tooltips
  # Available placeholders: {entity}, {ᴇɴᴛɪᴛʏ}
  # Delete this section if you don't want to use custom vanilla spawners name and lore
  vanilla_spawner:
    name: '{entity} Spawner'
