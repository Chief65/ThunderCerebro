  - damage{amount=7} @LivingInCone{a=30;r=5}
  - throw{velocity=3;velocityY=5} @LivingInCone{a=30;r=5}
  - effect:particles{particle=block_crack;material=COBBLESTONE} @Cone{a=30;r=5;p=200}

