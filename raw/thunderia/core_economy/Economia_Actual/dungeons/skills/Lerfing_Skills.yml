#Caster dashes forward then attacks in front, knocking up
dynamic_entry_mob:
  Cooldown: 10
  Conditions:
  - targetnotwithin{d=10} true
  - targetwithin{d=20} true
  Skills:
  - message{m="<caster.name>&2 has cast&6 Dynamic Entry!"} @PlayersInRadius{r=40}
  - potion{type=GLOWING;duration=20;level=1;p=false} @Self
