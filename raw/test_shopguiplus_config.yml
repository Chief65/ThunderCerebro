  # Buttons
  buttons:
    # "Set to 1" button (Fila 2, izquierda)
    set1:
      item:
        material: RED_STAINED_GLASS_PANE
        quantity: 1
        name: "&cEstablecer 1"
      slot: 9
    # "Remove 10" button (Fila 2, izquierda)
