      - ' &#FBE200Tierras:'
      - ' &d%changeoutput_equals_input:_matcher:{protectionstones_currentregion_owners}_ifmatch:&7| Sin Dueño_else:&7| &f{protectionstones_currentregion_owners}%'
      - '&f'
      - ' &ethundermc.es '   
