header-footer:
  enabled: true
  designs:
    world-world1:
      display-condition: '%world%=world1'
      header:
      - an example of world with custom
      footer:
      - header/footer and prefix/suffix
    world-world2;world3:
      display-condition: '%world%=world2|%world%=world3'
      header:
      - This is a shared header for
      - world2 and world3
      footer: []
    server-server1:
      display-condition: '%server%=server1'
      header:
      - an example of server with custom header
      footer: []
    default:
      display-condition: '%world%!=disabledworld'
      header:
      - '&8&l&m                                     '
      - ''
      - '&f &#FEEB00&lTHUNDERMC &f'
      - '&f&7ᴛʜᴜɴᴅᴇʀᴍᴄ.ᴇꜱ &f'
      - ''
      footer:
      - ''
      - '&8&l&m                                     '
tablist-name-formatting:
  enabled: true
  disable-condition: '%world%=disabledworld'
scoreboard-teams:
  enabled: true
  enable-collision: true
  invisible-nametags: false
  sorting-types:
  - GROUPS:admin,moderadorexperto,moderador,ayudante,media,titan,mythic,legend,heroe,knight,default
  - PERMISSIONS:tab.sort.vip
  - PLACEHOLDER_A_TO_Z:%player%
  case-sensitive-sorting: true
  can-see-friendly-invisibles: false
  disable-condition: '%world%=disabledworld'
playerlist-objective:
  enabled: false
  value: '%ping%'
  fancy-value: '&7Ping: %ping%'
  disable-condition: '%world%=disabledworld'
  title: TAB
  render-type: INTEGER
belowname-objective:
  enabled: true
  value: ''
  title: ''
  fancy-value: '<shadow:#000000:1>&#59E91F&l$&r<shadow:#000000:1>&#59E91F%vault_eco_balance_formatted% &8| &#EB1717%health%❤ &8| &7%zelteams_name%</shadow>'
  fancy-value-default: ''
  disable-condition: '%world%=disabledworld'
abovename:
  enabled: false
  text: '%rpgclasses_guild_relation_{viewer}%'
  disable-condition: '%world%=disabledworld'
prevent-spectator-effect:
  enabled: false
bossbar:
  enabled: true
  toggle-command: /bossbar
  remember-toggle-choice: false
  hidden-by-default: false
  bars:
    Grind:
      style: PROGRESS
      color: YELLOW
      progress: '100'
      text: '&e⛏ Zona de Mineria &8▶ &f¡Fly Activo!'
      display-condition: "%world%=desactivado"
    Dungeons:
      style: PROGRESS
      color: YELLOW
      progress: '100'
      text: '&e🗡 Zona Corrupta &8▶ &a✔ &f¡KeepInventory!'
      display-condition: "%world%=desactivado"
    Jefes:
      style: PROGRESS
      color: RED
      progress: '100'
      text: '&8┗&c☠&8┛ &cJefes &8▶ &f¡Aquí pierdes Objetos!'
      display-condition: "%world%=desactivado"
    Spawn:
      style: PROGRESS
      color: GREEN
      progress: '100'
      text: '&a🛡 Zona Segura &8▶ &fCiudad Thunder'
      display-condition: "%world%=desactivado"
######### MISIONES INICIALES ##########
    EjemploTutorial:
      style: PROGRESS
      color: YELLOW
      progress: '0'
      text: '&e⚑ &fEncuentra la &eMina Comunitaria &8(&71&8/&75&8)'
      display-condition: "%world%=Spawn"
scoreboard:
  enabled: true
  toggle-command: /sb
  remember-toggle-choice: false
  hidden-by-default: false
  delay-on-join-milliseconds: 0
  scoreboards:
######################################## BEDROCK ##############################################
    SurvivalBedrock: ############################## SURVIVAL
      display-condition: "%world%=world;%bedrock%=true"
      title: '%animation:thundermc%'
      lines:
      - '  &7%localtime_time_dd/MM% &8| &7%server_online% Online'
      - '&f'
