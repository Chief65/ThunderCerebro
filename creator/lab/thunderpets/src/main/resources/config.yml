# ==============================================================
#                 THUNDERPETS - CONFIGURACIÓN
#             ThunderStudios Network (MC 1.21.11)
# ==============================================================

settings:
  # Intervalo de actualización de movimiento (en ticks, 1 = máxima fluidez)
  tick-interval: 1
  # Distancia máxima antes de teletransportar a la mascota directamente al jugador
  max-follow-distance: 20.0
  # Suavizado de seguimiento (lerp factor: 0.1 a 1.0, 0.25 da un follow sedoso)
  smooth-factor: 0.25
  # Ocultar mascota si el jugador está en modo espectador
  hide-in-spectator: true

# ==============================================================
#                 CONFIGURACIÓN DE HUEVOS Y MISIONES
# ==============================================================
eggs:
  default-kills:
    SUPER: 10
    RARA: 20
    EPICA: 35
    MITICA: 50
    DIVINA: 75
    LIMITED: 100
  default-minutes:
    SUPER: 5
    RARA: 10
    EPICA: 20
    MITICA: 30
    DIVINA: 45
    LIMITED: 60

messages:
  prefix: "&6&lMASCOTAS &8▸ "
  pet-summoned: "&aHas invocado a tu compañero %pet%&a."
  pet-despawned: "&eHas guardado a tu mascota."
  already-active: "&eYa tienes a esta mascota equipada. Guardándola..."
  no-permission: "&cNo tienes permiso para equipar esta mascota."
  menu-title: "&8&lCOSMÉTICOS &8▸ &eMascotas"
  reload-success: "&aConfiguración recargada correctamente."

