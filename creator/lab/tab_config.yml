header-footer:
  enabled: true
  designs:
    world-world1:
      display-condition: '%world%=world1'
      header:
      - an example of world with custom
      footer:
      - header/footer and prefix/suffix
    world-world2;world3:
      display-condition: '%world%=world2|%world%=world3'
      header:
      - This is a shared header for
      - world2 and world3
      footer: []
    server-server1:
      display-condition: '%server%=server1'
      header:
      - an example of server with custom header
      footer: []
    default:
      display-condition: '%world%!=disabledworld'
      header:
      - '&8&l&m                                     '
      - ''
      - '&f &#FEEB00&lTHUNDERMC &f'
      - '&f&7thundermc.es &f'
      - ''
      - '&7Jugando %bungee_total% 👤'
      - ''
      footer:
      - ''
      - '&8&l&m                                     '
tablist-name-formatting:
  enabled: true
  disable-condition: '%world%=disabledworld'
scoreboard-teams:
  enabled: true
  enable-collision: true
  invisible-nametags: false
  sorting-types:
  - GROUPS:admin,moderador,titan,mythic,legend,heroe,knight,default
  - PLACEHOLDER_A_TO_Z:%player%
  case-sensitive-sorting: true
  can-see-friendly-invisibles: false
  disable-condition: '%world%=disabledworld'
playerlist-objective:
  enabled: false
  value: '%ping%'
  fancy-value: '&7Ping: %ping%'
  disable-condition: '%world%=disabledworld'
  title: TAB
  render-type: INTEGER
belowname-objective:
  enabled: true
  value: ''
  title: ''
  fancy-value: '<shadow:#000000:1>&#59E91F&l$</shadow>&r<shadow:#000000:1>&#59E91F%vault_eco_balance_formatted%</shadow> &8| &7%zelteams_name%'
  fancy-value-default: ''
  disable-condition: '%world%=disabledworld'
abovename:
  enabled: false
  text: '%rpgclasses_guild_relation_{viewer}%'
  disable-condition: '%world%=disabledworld'
prevent-spectator-effect:
  enabled: false
bossbar:
  enabled: true
  toggle-command: /bossbar
  remember-toggle-choice: false
  hidden-by-default: false
  bars:
    Grind:
      style: PROGRESS
      color: YELLOW
      progress: '100'
      text: '&e⛏ Zona de Mineria &8▶ &f¡Fly Activo!'
      display-condition: "%world%=desactivado"
    Dungeons:
      style: PROGRESS
      color: YELLOW
      progress: '100'
      text: '&e🗡 Zona Corrupta &8▶ &a✔ &f¡KeepInventory!'
      display-condition: "%world%=desactivado"
    Jefes:
      style: PROGRESS
      color: RED
      progress: '100'
      text: '&8┗&c☠&8┛ &cJefes &8▶ &f¡Aquí pierdes Objetos!'
      display-condition: "%world%=desactivado"
    Spawn:
      style: PROGRESS
      color: GREEN
      progress: '100'
      text: '&a🛡 Zona Segura &8▶ &fCiudad Thunder'
      display-condition: "%world%=desactivado"
######### MISIONES INICIALES ##########
    EjemploTutorial:
      style: PROGRESS
      color: YELLOW
      progress: '0'
      text: '&e⚑ &fEncuentra la &eMina Comunitaria &8(&71&8/&75&8)'
      display-condition: "%world%=Spawn"
scoreboard:
  enabled: true
  toggle-command: /sb
  remember-toggle-choice: false
  hidden-by-default: false
  delay-on-join-milliseconds: 0
  scoreboards:
    survival:
      display-condition: "%world%=world"
      title: '%animation:thundermc%'
      lines:
      - '    &7⌛ Pruebas '
      - '&f'
      - ' <shadow:#000000:1>&fPruebas</shadow>'
      - ' &8● %luckperms_prefix%'
      - '' #6
      - ' <shadow:#000000:1>&#FEEB00| &fTeam: &#FEEB00Prueba 👥</shadow>'
      - ' &#59E91F| <shadow:#000000:1>&fDinero: &#59E91F&l$</shadow>&r<shadow:#000000:1>&#59E91F%vault_eco_balance_formatted%</shadow>'
      - ' &#34B0F3| <shadow:#000000:1>&fAlmas: &#34B0F3%thundercurrencys_almas%🔥</shadow>'
      - ' &#34B0F3| <shadow:#000000:1>&fZafiros: &#34B0F3%thundercurrencys_zafiros%🔥</shadow>'
      - ' &#CF27F5| <shadow:#000000:1>&fJugado: &#CF27F5100h⌚</shadow>'
      - '&f'
      - '  &ethundermc.es ' #14
    scoreboard-1.20.3+:
      title: '%animation:thundermc%'
      lines:
      - ' &7ᴛʜᴜɴᴅᴇʀᴍᴄ.ᴇꜱ'
      - '' 
      - ' <shadow:#000000:1>&#FEEB00%player_name%</shadow>'
      - ' <shadow:#000000:1>&#34B0F3| &fZafiros: &#34B0F3%thundercurrencys_zafiros%'
      - ' <shadow:#000000:1>&#59E91F| &fDinero: &#59E91F&l$&r<shadow:#000000:1>&#59E91F%vault_eco_balance_formatted%'
      - ' <shadow:#000000:1>&#00A896| &fAlmas: &#00A896%thundercurrencys_almas%'
      - ' <shadow:#000000:1>&#CF27F5| &fJugado: &#CF27F5%statistic_hours_played%h '
      - ' <shadow:#000000:1>&#F58E27| <shadow:#000000:1>&fKills: &#F58E27%statistic_player_kills%'
      - ' <shadow:#000000:1>&#F52727| <shadow:#000000:1>&fMuertes: &#F52727%statistic_deaths%'
      - ' <shadow:#000000:1>&e| &fTeam: &eTeam '
      - '&f'   
      - ' &7Nivel &71/&7120⭐'
    goty+:
      condition: permission:tab.staff.op
      title: '%animation:thundermc%'
      lines:
      - 'Nivel </shadow>&71&8/&720⭐'
      - '' 
      - ' <shadow:#000000:1>&#FEEB00%player_name%</shadow>'
      - ' <shadow:#000000:1>&#34B0F3| &fZafiros: &#34B0F3%thundercurrencys_zafiros%'
      - ' <shadow:#000000:1>&#59E91F| &fDinero: &#59E91F&l$&r<shadow:#000000:1>&#59E91F%vault_eco_balance_formatted%'
      - ' <shadow:#000000:1>&#00A896| &fAlmas: &#00A896%thundercurrencys_almas%'
      - ' <shadow:#000000:1>&#CF27F5| &fJugado: &#CF27F5%statistic_hours_played%h '
      - ' <shadow:#000000:1>&#F58E27| <shadow:#000000:1>&fKills: &#F58E27%statistic_player_kills%'
      - ' <shadow:#000000:1>&#F52727| <shadow:#000000:1>&fMuertes: &#F52727%statistic_deaths%'
      - ' <shadow:#000000:1>&e| &fTeam: &eTeam '
      - '&f'   
      - ' &7ᴛʜᴜɴᴅᴇʀᴍᴄ.ᴇꜱ'
layout:
  enabled: false
  direction: COLUMNS
  default-skin: mineskin:383747683
  enable-remaining-players-text: true
  remaining-players-text: '... and %s more'
  empty-slot-ping-value: 1000
  layouts:
    default:
      fixed-slots:
      - ''
      - 2|&cAdmin&7()
      - '3|&8&m                       '
      - '4|&3Name&f:'
      - 5|&b%player%
      - '7|&3Rank&f:'
      - '8|Rank: %group%'
      - '10|&3World&f:'
      - 11|&b%world%
      - '13|&3Time&f:'
      - 14|&b%time%
      - '21|&3Teamspeak&f:'
      - 22|&bts.myserver.net
      - '23|&8&m                       '
      - '41|&3Store&f:'
      - 42|&bshop.myserver.net
      - '43|&8&m                       '
      groups:
        staff:
          slots:
          - 24-40
          display-condition: permission:tab.staff
        players:
          slots:
          - 44-80
ping-spoof:
  enabled: false
  value: 0
placeholders:
  date-format: dd.MM.yyyy
  time-format: '[HH:mm:ss / h:mm a]'
  time-offset: 0
  register-tab-expansion: false
placeholder-output-replacements:
  '%essentials_vanished%':
    'yes': '&7| Vanished'
    'no': ''
conditions:
  nick:
    conditions:
    - '%player%=%essentials_nickname%'
    true: '%player%'
    false: ~%essentials_nickname%
assign-groups-by-permissions: false
primary-group-finding-list:
- Admin
- Helper
- plus
- default
permission-refresh-interval: 1000
debug: false
mysql:
  enabled: false
  host: 127.0.0.1
  port: 3306
  database: tab
  username: user
  password: password
  useSSL: true
per-world-playerlist:
  enabled: false
  allow-bypass-permission: false
  ignore-effect-in-worlds:
  - ignoredworld
  - build
  shared-playerlist-world-groups:
    lobby:
    - lobby1
    - lobby2
    minigames:
    - paintball
    - bedwars
compensate-for-packetevents-bug: false
global-playerlist:
  enabled: true
  display-others-as-spectators: false
  display-vanished-players-as-spectators: true
  isolate-unlisted-servers: false
  update-latency: false
  spy-servers:
  - survival
  server-groups:
    lobbies:
    - lobby1
    - lobby2
    group2:
    - server1
    - server2
use-bukkit-permissions-manager: false
use-online-uuid-in-tablist: true
proxy-support:
  enabled: true
  type: PLUGIN
  plugin:
    name: RedisBungee
  redis:
    url: redis://:password@localhost:6379/0
  rabbitmq:
    exchange: plugin
    url: amqp://guest:guest@localhost:5672/%2F
  channel-name-suffix: TAB
placeholder-refresh-intervals:
  default-refresh-interval: 500
  '%server_uptime%': 1000
  '%server_tps_1_colored%': 1000
  '%server_unique_joins%': 5000
  '%player_health%': 200
  '%player_ping%': 1000
  '%vault_prefix%': 1000
  '%rel_factionsuuid_relation_color%': 1000
config-version: 5
components:
  minimessage-support: true
  disable-shadow-for-heads: true
