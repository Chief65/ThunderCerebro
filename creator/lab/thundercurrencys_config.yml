# ThunderCurrencys - Configuracion
# Base de datos SQLite
database:
  file: "thundercurrencys.db"

# Economias predefinidas
# Cada economia tiene:
#   alias: abreviacion para el comando /playerpoints:<alias>
#   placeholder: nombre del placeholder %thundercurrencys_<placeholder>%
#   permanent: true = permanente, false = temporal
#   duration: duracion en minutos (solo si permanent: false, 0 = sin limite)
#   default-balance: balance inicial para jugadores nuevos
economies:
  almas:
    alias: "p"
    placeholder: "almas"
    permanent: true
    duration: 0
    default-balance: 0
  zafiros:
    alias: "zafiros"
    placeholder: "zafiros"
    permanent: true
    duration: 0
    default-balance: 0
  afkpoints:
    alias: "afk"
    placeholder: "afkpoints"
    permanent: true
    duration: 0
    default-balance: 0
  cromaticos:
    alias: "cr"
    placeholder: "cromaticos"
    permanent: true
    duration: 0
    default-balance: 0

# ==================== ShopGUI+ ====================
# Mapea cada tienda de ShopGUI+ (por su id) a una economia de ThunderCurrencys.
# En el .yml de cada tienda pon:  economy: CUSTOM
# y aqui indica que moneda usa esa tienda.
#
# Formato:  <id-tienda>: <id-economia>
# Si una tienda con economy: CUSTOM no aparece aqui, se usa 'default-economy'.
shopgui:
  default-economy: "almas"
  shops:
    almas: "almas"
    zafiros: "zafiros"
    cromaticos: "cromaticos"
    afkpoints: "afkpoints"
