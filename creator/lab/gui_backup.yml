spawner_storage_item:
  # Placeholders disponibles para name:
  # {max_slots} - Número máximo de espacios en el almacenamiento (formateado con comas)
  # {current_items} - Número actual de ítems en el almacenamiento
  # {percent_storage_rounded} - Porcentaje de almacenamiento usado (0-100)
  # {entity} - Tipo de entidad del generador (mayúsculas normales)
  # {ᴇɴᴛɪᴛʏ} - Tipo de entidad del generador (versalitas)
  name: '&#e67e22ᴀʟᴍᴀᴄᴇɴ ᴅᴇʟ ɢᴇɴᴇʀᴀᴅᴏʀ'

  # Placeholders disponibles para todas las líneas de lore:
  # {max_slots} - Número máximo de espacios en el almacenamiento (formateado con comas)
  # {current_items} - Número actual de ítems en el almacenamiento
  # {percent_storage_rounded} - Porcentaje de almacenamiento usado (0-100)
  # {loot_items} - Lista completa formateada de ítems de botín
  # {entity} - Tipo de entidad del generador (mayúsculas normales)
  # {ᴇɴᴛɪᴛʏ} - Tipo de entidad del generador (versalitas)
  lore:
  - ''
  - '&#e67e22◈ &#ecf0f1ᴇꜱᴛᴀᴅɪꜱᴛɪᴄᴀꜱ:'
  - '  &#bdc3c7•  ʀᴀɴᴜʀᴀꜱ: &#e67e22{current_items} &#bdc3c7/ &#e67e22{max_slots}'
  - '  &#bdc3c7•  ᴀʟᴍᴀᴄᴇɴ: &#e67e22{percent_storage_rounded}% &#bdc3c7ʟʟᴇɴᴏ'
  - ''
  - '&#e67e22⊳ &#ecf0f1ᴄʟɪᴄ ᴘᴀʀᴀ ᴀʙʀɪʀ ᴀʟᴍᴀᴄᴇɴ'
  # Puedes agregar una línea opcional para mostrar todos los ítems de botín.
  # - '{loot_items}'

    # Esto define cómo se mostrará cada ítem de botín al usar {loot_items}
  # Placeholders disponibles para cada ítem de botín:
  # {item_name} - Nombre del ítem (mayúsculas normales)
  # {amount} - Cantidad de ítems (formateado con comas)
  # {raw_amount} - Cantidad de ítems (sin formatear)
  # {chance} - Probabilidad de que caiga este ítem (con símbolo %, ej. "8.5%")
  loot_items: '  &#bdc3c7•  &#2ecc71{amount} &#bdc3c7{item_name}'
  loot_items_empty: '  &#bdc3c7•  ɴɪɴɢᴜɴᴏ'


# Placeholders disponibles:
# {entity}           - Nombre de entidad formateado (ej. "Zombie")
# {ᴇɴᴛɪᴛʏ}           - Nombre de entidad en versalitas (ej. "ᴢᴏᴍʙɪᴇ")
# {stack_size}       - Número de generadores apilados en esta ubicación
# {range}            - Rango de generación en bloques
# {delay}            - Retraso de generación en segundos
# {min_mobs}         - Número mínimo de mobs a generar
# {max_mobs}         - Número máximo de mobs a generar
# {current_items}    - Número actual de ítems almacenados
# {max_items}        - Capacidad máxima de almacenamiento de ítems
# {percent_storage_rounded}  - Uso de almacenamiento como porcentaje entero (ej. "87")
# {percent_storage_decimal} - Uso de almacenamiento como porcentaje con decimales (ej. "87.5")
# {current_exp}      - Experiencia actual almacenada (formateado con comas)
# {max_exp}          - Capacidad máxima de experiencia (formateado con comas)
# {raw_current_exp}  - Número crudo de experiencia actual
# {raw_max_exp}      - Número crudo de experiencia máxima
# {percent_exp_rounded}      - Almacenamiento de experiencia como porcentaje entero
# {percent_exp_decimal}    - Almacenamiento de experiencia como porcentaje con decimales (ej. "42.7")
