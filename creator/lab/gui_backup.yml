#                  GUI de Bedrock
# ──────────────────────────────────────────────────────
bedrock:
  main_gui:
    title_single_spawner: '{entity} Generador'
    title_stacked_spawner: '{amount} Generadores de {entity}'

    view_info_title: '{entity} Generador - Información'

    button_names:
      storage: Abrir Almacén
      exp: Recoger EXP
      stacker: Gestionar Pila
      sell_and_exp: Vender Objetos y Recoger EXP
      sell: Vender Objetos
      view_info: Ver Información
      back: Volver

    # Placeholders disponibles (los mismos que spawner_info_item):
    # Placeholders disponibles:
    # {entity}           - Nombre de entidad formateado (ej. "Zombie")
    # {ᴇɴᴛɪᴛʏ}           - Nombre de entidad en versalitas (ej. "ᴢᴏᴍʙɪᴇ")
    # {stack_size}       - Número de generadores apilados en esta ubicación
    # {range}            - Rango de generación en bloques
    # {delay}            - Retraso de generación en segundos
    # {min_mobs}         - Número mínimo de mobs a generar
    # {max_mobs}         - Número máximo de mobs a generar
    # {current_items}    - Número actual de ítems almacenados
    # {max_items}        - Capacidad máxima de almacenamiento de ítems
    # {percent_storage_rounded}  - Uso de almacenamiento como porcentaje entero (ej. "87")
    # {percent_storage_decimal} - Uso de almacenamiento como porcentaje con decimales (ej. "87.5")
    # {current_exp}      - Experiencia actual almacenada (formateado con comas)
    # {max_exp}          - Capacidad máxima de experiencia (formateado con comas)
    # {raw_current_exp}  - Número crudo de experiencia actual
    # {raw_max_exp}      - Número crudo de experiencia máxima
    # {percent_exp_rounded}      - Almacenamiento de experiencia como porcentaje entero
    # {percent_exp_decimal}    - Almacenamiento de experiencia como porcentaje con decimales (ej. "42.7")

        # IMPORTANTE: Usa solo códigos de color compatibles con Bedrock:
    # §0=Negro, §1=Azul Oscuro, §2=Verde Oscuro, §3=Aqua Oscuro, §4=Rojo Oscuro, §5=Púrpura Oscuro
    # §6=Oro, §7=Gris, §8=Gris Oscuro, §9=Azul, §a=Verde, §b=Aqua, §c=Rojo
    # §d=Púrpura Claro, §e=Amarillo, §f=Blanco, §g=Oro de Minecoin
    spawner_info:
    - ''
    - '§9◈ §fInformación:'
    - '  §7• Pila: §9{stack_size}'
    - '  §7• Rango: §9{range} §7bloques'
    - '  §7• Mobs: §9{min_mobs} §7- §9{max_mobs}'
    - '  §7• Retraso: §9{delay} §7s'
    - ''
    - '§9◈ §fAlmacén:'
    - '  §7• Ítems: §9{current_items} §7/ §9{max_items}'
    - '  §7• Almacenamiento: §9{percent_storage_decimal}% §7lleno'
    - ''
    - '§9◈ §fExperiencia:'
    - '  §7• Actual: §a{current_exp} §7/ §a{max_exp} §axp'
    - '  §7• Almacenado: §a{percent_exp_decimal}% §7xp'
    - ''
    - '§a◈ §fValor de Venta: §a+${total_sell_price}'
