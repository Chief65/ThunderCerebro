# =========================================================================
# ThunderRanks - Sistema de Rangos y Ascensiones por Etapas
# Progresión: 7 Rangos x 5 Sub-etapas (Tiers I-V) x 5 Recompensas por etapa
# =========================================================================

settings:
  bossbar-duration-seconds: 6
  playtime-interval-seconds: 60
  playtime-xp: 25

messages:
  prefix: "&8[&e&lRangos&8] &r"
  xp-gain: "&7+%amount% XP de Rango &8(&f%total%/%max% XP&8)"
  milestone-complete: "&a&l¡RECOMPENSA DESBLOQUEADA! &7Hito &e%milestone%/5 &7en &r%rank% %tier%&7."
  tierup-ready: "&6&l¡SUB-ETAPA COMPLETADA! &aHas dominado &r%rank% %tier%&a. Usa &e/rankup &apara ascender a &e%next_tier%&a."
  tierup-success: "&a❖ &fHas ascendido a &r%rank% %tier%&f! &a❖"
  rankup-ready: "&6&l¡GRAN ASCENSIÓN DISPONIBLE! &aHas completado todas las etapas de &r%rank%&a. Usa &e/rankup &apara ascender a &r%next_rank%&a."
  rankup-success: "&6❖ &f%player% ha ascendido al rango &r%rank%&f! &6❖"
  not-enough-money: "&cNo tienes suficiente dinero. Necesitas &e$%cost% &cy tienes &e$%balance%&c."
  not-ready-rankup: "&cAún no has completado los 5 hitos de tu etapa actual (%current%/%max% XP)."
  max-rank: "&d&l¡Ya te encuentras en el rango supremo COSMOS V!"

# Fuentes de ganancia de XP
xp-sources:
  custom-crops: 35 # XP por cada cultivo cosechado en ThunderCrops
  mining:
    COAL_ORE: 15
    DEEPSLATE_COAL_ORE: 15
    COPPER_ORE: 15
    DEEPSLATE_COPPER_ORE: 15
    IRON_ORE: 25
    DEEPSLATE_IRON_ORE: 25
    GOLD_ORE: 35
    DEEPSLATE_GOLD_ORE: 35
    REDSTONE_ORE: 25
    DEEPSLATE_REDSTONE_ORE: 25
    LAPIS_ORE: 25
    DEEPSLATE_LAPIS_ORE: 25
    DIAMOND_ORE: 75
    DEEPSLATE_DIAMOND_ORE: 75
    EMERALD_ORE: 100
    DEEPSLATE_EMERALD_ORE: 100
    ANCIENT_DEBRIS: 200
    WHEAT: 10
    CARROTS: 10
    POTATOES: 10
    STONE: 2
    DEEPSLATE: 2
  mobs:
    ZOMBIE: 20
    SKELETON: 20
    SPIDER: 20
    CAVE_SPIDER: 25
    CREEPER: 30
    ENDERMAN: 50
    BLAZE: 40
    WITHER_SKELETON: 60
    WITHER: 500
    ENDER_DRAGON: 1000

