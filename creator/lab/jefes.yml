# ========== JEFE FÁCIL ==========
HadesZombie:
  Type: ZOMBIE
  Display: '&4&l☠ Hades, Heraldo de la Cripta ☠'
  Health: 500
  Damage: 18
  Options:
    Scale: 1.4
    MovementSpeed: 0.22
    PreventOtherDrops: true
    Knockback: 2
  Equipment:
    - NETHERITE_HELMET HEAD
    - IRON_CHESTPLATE CHEST
    - IRON_LEGGINGS LEGS
    - IRON_BOOTS FEET
    - IRON_SWORD HAND
  BossBar:
    Enabled: true
    Title: '&4☠ &cHades, Heraldo de la Cripta &4☠'
    Color: RED
    Style: SEGMENTED_10
    CreateFog: true
  Skills:
    - skill{s=HadesAturdir} @target ~onTimer:200 ?targetwithin{d=8}
    - skill{s=HadesRalentizar} @PIR{r=10} ~onTimer:300
    - message{m="&4☠ &cHades ha despertado..."} @PIR{r=30} ~onSpawn
  Drops:
    - EsenciaDragon 1-2 1
    - FragmentoAlmaPerdida 3-5 1
    - DIAMOND 2-4 1

