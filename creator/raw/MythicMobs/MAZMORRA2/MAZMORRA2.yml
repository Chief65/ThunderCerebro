# ===== CAPATAZ DE LA MINA NIVEL 3 =====
CapatazMina:
  Type: IRON_GOLEM
  Display: '&6Lvl 3 &8| &fᴄᴀᴘᴀᴛᴀᴢ ᴅᴇ ʟᴀ ᴍɪɴᴀ &8| <#ED1313><caster.hp{r=0}><&heart>'
  Health: 28
  Damage: 15
  Options:
    Scale: 1.2
    MovementSpeed: 0.20
    PreventOtherDrops: true
    LeashRange: 15
    FollowRange: 10
    Despawn: false
    ReturnHome: true
  AIGoalSelectors:
    - 0 clear
    - 1 meleeattack
    - 2 randomstroll
    - 3 lookatplayers
  AITargetSelectors:
    - 0 clear
    - 1 players
  Drops:
    - IRON_INGOT 1-5 1
    - ROTTEN_FLESH 1 1
  Skills:
    ####### VISUAL #######
    - skill{s=SonidoKill} @trigger ~onDeath
    - setname{n=<caster.name>;delay=2} @self ~onDamaged
    - particles{particle=SCULK_SOUL;amount=70;speed=0.1;hSpread=0.7;vSpread=0.7} @self ~onDeath
    ####### RECOMPENSAS #######
    - actionmessage{m="<#34B0F3>+4 <white>Almas <#34B0F3>🔥 &8| <#59E91F>+<#59E91F>&l$&r<#59E91F>40"} @trigger ~onDeath 
    - command{c="points give <trigger.name> 4 -s";sender=console} @self ~onDeath 
    - command{c="economy give <trigger.name> 40 -s";sender=console} @self ~onDeath  
    - command{c="si give fragmentosuper 1 <trigger.name> -s";sender=console} @self ~onDeath 0.02 
    - command{c="si give fragmentorara 1 <trigger.name> -s";sender=console} @self ~onDeath 0.02 
    - command{c="si give fragmentogadget 1 <trigger.name> -s";sender=console} @self ~onDeath 0.02 
    ####### EXTRAS #######
    - potion{type=SPEED;duration=80;level=1} @self ~onDamaged ?health{h=<50}
    - skill{s=BoostAlmas} @self ~onDeath 
    - setvariable{var=almas;value=4;scope=CASTER;type=INTEGER} @self ~onSpawn
    
