    FollowRange: 10
    Despawn: false
    ReturnHome: true
    Silent: false
  AIGoalSelectors:
    - 0 clear
    - 1 rangedattack
    - 2 randomstroll
    - 3 lookatplayers
    - 4 float
  AITargetSelectors:
    - 0 clear
    - 1 players
  Drops:
    - ARROW 2-5 1
    - COAL 1-2 0.6
  Skills:
    ####### VISUAL #######
    - skill{s=SonidoKill} @trigger ~onDeath
    - setname{n=<caster.name>;delay=2} @self ~onDamaged
    - particles{particle=SCULK_SOUL;amount=50;speed=0.1;hSpread=0.5;vSpread=0.5} @self ~onDeath
    ####### RECOMPENSAS #######
    - actionmessage{m="<#34B0F3>+3 <white>Almas <#34B0F3>🔥 &8| <#59E91F>+<#59E91F>&l$&r<#59E91F>25"} @trigger ~onDeath 
    - command{c="points give <trigger.name> 3 -s";sender=console} @self ~onDeath 
    - command{c="economy give <trigger.name> 25";sender=console} @self ~onDeath 
    - command{c="si give fragmentosuper 1 <trigger.name> -s";sender=console} @self ~onDeath 0.02 
    - command{c="si give fragmentorara 1 <trigger.name> -s";sender=console} @self ~onDeath 0.02 
    - command{c="si give fragmentogadget 1 <trigger.name> -s";sender=console} @self ~onDeath 0.02 
    - command{c="si give fragmentomitica 1 <trigger.name> -s";sender=console} @self ~onDeath 0.003 
    ####### EXTRAS #######
    # Salto cada 5 segundos — simula que se reposiciona entre plataformas
    - leap{velocity=1.2} @self ~onTimer:100
    # Al recibir daño huye brevemente para mantener distancia
    - potion{type=SPEED;duration=40;level=2} @self ~onDamaged
    - skill{s=BoostAlmas} @self ~onDeath 
    - setvariable{var=almas;value=3;scope=CASTER;type=INTEGER} @self ~onSpawn
    
