# ===== GUARDIÁN DE LA FORJA (MOB PESADO) =====
GuardianForja:
  Type: ZOMBIE
  Display: '&cLvl 4 &8| &fᴄᴀᴍᴘᴇᴏɴ ᴄᴀɪᴅᴏ &8| <#ED1313><caster.hp{r=0}><&heart>'
  Health: 35
  Damage: 20
  Equipment:
    - GOLDEN_AXE HAND
    - GOLDEN_HELMET HEAD
    - IRON_CHESTPLATE CHEST
    - DIAMOND_LEGGINGS LEGS
    - DIAMOND_BOOTS FEET
  Options:
    Scale: 1.2
    MovementSpeed: 0.22
    PreventOtherDrops: true
    LeashRange: 16
    FollowRange: 10
    Despawn: false
    ReturnHome: true
    Silent: false
  AIGoalSelectors:
    - 0 clear
    - 1 meleeattack
    - 2 randomstroll
    - 3 lookatplayers
  AITargetSelectors:
    - 0 clear
    - 1 players
  Drops:
    - IRON_INGOT 1-3 1
    - GOLD_NUGGET 1-2 0.5
  Skills:
    ####### VISUAL #######
    - skill{s=SonidoKill} @trigger ~onDeath
    - setname{n=<caster.name>;delay=2} @self ~onDamaged
    - particles{particle=SCULK_SOUL;amount=50;speed=0.1;hSpread=0.5;vSpread=0.5} @self ~onDeath
    ####### RECOMPENSAS #######
    - actionmessage{m="<#34B0F3>+5 <white>Almas <#34B0F3>🔥 &8| <#59E91F>+<#59E91F>&l$&r<#59E91F>60"} @trigger ~onDeath 
    - particles{particle=FLAME;amount=60;speed=0.15;hSpread=0.8;vSpread=0.8} @self ~onDamaged ?health{h=<42} 
    - command{c="points give <trigger.name> 5 -s";sender=console} @self ~onDeath 
    - command{c="economy give <trigger.name> 60";sender=console} @self ~onDeath 
    - command{c="si give fragmentosuper 1 <trigger.name> -s";sender=console} @self ~onDeath 0.02 
    - command{c="si give fragmentorara 1 <trigger.name> -s";sender=console} @self ~onDeath 0.02 
    - command{c="si give fragmentogadget 1 <trigger.name> -s";sender=console} @self ~onDeath 0.02 
    - command{c="si give fragmentomitica 1 <trigger.name> -s";sender=console} @self ~onDeath 0.003 
    ####### EXTRAS #######
    # Primer umbral — al 60% HP golpe de tierra visual (partículas + slow al jugador)
    - particles{particle=LAVA;amount=30;speed=0.2;hSpread=1.0;vSpread=0.5} @target ~onDamaged ?health{h=<84}
    - potion{type=SLOWNESS;duration=60;level=1} @target ~onDamaged ?health{h=<84}
    # Segundo umbral — al 30% HP el guardián se fortalece
    - potion{type=STRENGTH;duration=100;level=1} @self ~onDamaged ?health{h=<42}
    - skill{s=BoostAlmas} @self ~onDeath 
    - setvariable{var=almas;value=5;scope=CASTER;type=INTEGER} @self ~onSpawn
    
# ===== EXPLORADOR ÍGNEO (MOB RÁPIDO) =====
ExploradorIgneo:
