# ===== JABALI NIVEL 1 =====
jabali1:
  Type: PIG
  Display: '&aLvl 1 &8| &fᴊᴀʙᴀʟɪ &8| <#ED1313><caster.hp{r=0}><&heart>'
  Health: 12
  Damage: 7
  Options:
    Scale: 1.3
    MovementSpeed: 0.23
    PreventOtherDrops: true
    LeashRange: 10
    FollowRange: 10
    Despawn: false
    ReturnHome: true
    UsePlaceholderAPI: true
  Attributes:
    GENERIC_ATTACK_DAMAGE: 7
  AIGoalSelectors:
    - 0 clear
    - 1 meleeattack
    - 2 randomstroll
    - 3 lookatplayers
    - 4 float
  AITargetSelectors:
    - 0 clear
    - 1 players
  Drops:
    - PORKCHOP 1-2 1
  Skills:
    ####### VISUAL #######
    - skill{s=SonidoKill} @trigger ~onDeath
    - particles{particle=SCULK_SOUL;amount=50;speed=0.1;hSpread=0.5;vSpread=0.5} @self ~onDeath
    - setname{n=<caster.name>;delay=2} @self ~onDamaged
    ####### RECOMPENSAS #######
    - command{c="points give <trigger.name> 1 -s";sender=console} @trigger ~onDeath 
    - actionmessage{m="<#34B0F3>+1 <white>Alma <#34B0F3>🔥 &8| <#59E91F>+<#59E91F>&l$&r<#59E91F>10"} @trigger ~onDeath 
    - command{c="economy give <trigger.name> 10 -s";sender=console} @trigger ~onDeath 
    - command{c="si give fragmentosuper 1 <trigger.name> -s";sender=console} @trigger ~onDeath 0.02 
    - command{c="si give fragmentorara 1 <trigger.name> -s";sender=console} @trigger ~onDeath 0.02 
    ####### EXTRAS #######
    - skill{s=BoostAlmas} @trigger ~onDeath 
    - setvariable{var=almas;value=1;scope=CASTER;type=INTEGER} @self ~onSpawn


