LlamaPiñata:
  Type: TRADER_LLAMA
  Display: '&e[Lv.1] &6¡Piñata!'
  Health: 6000
  Options:
    Scale: 2
    MovementSpeed: 0.5
    PreventOtherDrops: true
    Despawn: false
    ReturnHome: true
    LeashRange: 8
    ReturnHomeRange: 8
    KnockbackResistance: 1.0
    Glowing: true
  BossBar:
    Enabled: true
    Title: '&e🎉 &6¡Piñata! &e🎉'
    Range: 40
    Color: YELLOW
    Style: SEGMENTED_20
  DamageModifiers:
  - ENTITY_ATTACK 0
  - PROJECTILE 0
  - MAGIC 0
  - FALL 0
  - FIRE 0
  - SUFFOCATION 0
  AIGoalSelectors:
    - 0 clear
    - 1 randomstroll
    - 2 float
  AITargetSelectors:
    - 0 clear
  Drops:
    - FIREWORK_ROCKET 1-3 1
  Skills:
    - heal{amount=-1} @self ~onDamaged
    - skill{s=PinataGolpe} @self ~onDamaged
    - skill{s=PinataMuerte} @self ~onDeath
    - skill{s=LevantamientoPiñata} @self ~onTimer:300

    - particles{particle=REDSTONE;color=#FF0000;amount=20;speed=0;hSpread=1.5;vSpread=1.5} @self ~onTimer:10
    - particles{particle=REDSTONE;color=#FF7700;amount=20;speed=0;hSpread=1.5;vSpread=1.5} @self ~onTimer:15
    - particles{particle=REDSTONE;color=#FFFF00;amount=20;speed=0;hSpread=1.5;vSpread=1.5} @self ~onTimer:20
    - particles{particle=REDSTONE;color=#00FF00;amount=20;speed=0;hSpread=1.5;vSpread=1.5} @self ~onTimer:25
    - particles{particle=REDSTONE;color=#0000FF;amount=20;speed=0;hSpread=1.5;vSpread=1.5} @self ~onTimer:30
    - particles{particle=REDSTONE;color=#FF00FF;amount=20;speed=0;hSpread=1.5;vSpread=1.5} @self ~onTimer:35

    - command{c="points give <trigger.name> 1 -s";sender=console} @self ~onDamaged 1
    - command{c="ei give <trigger.name> bolsadedinero 1 -s";sender=console} @self ~onDamaged 0.05
    - command{c="economy give <trigger.name> 50 -s";sender=console} @self ~onDamaged 1
    - actionmessage{m="<#34B0F3>+1 <white>Alma <#34B0F3>🔥 &8| <#59E91F>+<#59E91F>&l$&r<#59E91F>50"} @trigger ~onDamaged

    - command{c="si give fragmentosuper 1 <trigger.name> -s";sender=console} @self ~onDamaged 0.25
    - command{c="si give fragmentorara 1 <trigger.name> -s";sender=console} @self ~onDamaged 0.15
    - command{c="si give fragmentogadget 1 <trigger.name> -s";sender=console} @self ~onDamaged 0.05
    - command{c="si give fragmentomitica 1 <trigger.name> -s";sender=console} @self ~onDeath 0.025
    - skill{s=DropFragmentoLimitedPiñata} @self ~onDamaged 0.005

    - skill{s=DropLlaveSuper} @self ~onDamaged 0.005
    - skill{s=DropLlaveRara} @self ~onDamaged 0.003
    - skill{s=DropLlaveGadgets} @self ~onDamaged 0.002
    - skill{s=DropLlaveMiticaPiñata} @self ~onDamaged 0.001

    - skill{s=BoostAlmas} @self ~onDeath 
    - setvariable{var=almas;value=1;scope=CASTER;type=INTEGER} @self ~onSpawn