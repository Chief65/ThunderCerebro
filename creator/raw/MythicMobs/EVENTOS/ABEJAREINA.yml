AbejaReina:
  Type: BEE
  Display: '&4ᴀʙᴇᴊᴀ ʀᴇɪɴᴀ &8| <#ED1313><caster.hp{r=0}><&heart>'
  Health: 3000
  Options:
    Scale: 7
    MovementSpeed: 1
    PreventOtherDrops: true
    Despawn: false
    ReturnHome: true
    LeashRange: 20
    KnockbackResistance: 1.0
  BossBar:
    Enabled: true
    Title: '&8┖&f☠&8┚ &4ᴀʙᴇᴊᴀ ʀᴇɪɴᴀ'
    Range: 40
    Color: RED
    Style: SEGMENTED_10
  DamageModifiers:
  - ENTITY_ATTACK 0
  - PROJECTILE 0
  - MAGIC 0
  - FALL 0
  - FIRE 0
  - SUFFOCATION 0
  AIGoalSelectors:
    - 0 clear
    - 1 randomstroll{speed=0.8}
    - 2 float
  AITargetSelectors:
    - 0 clear
  Drops:
    - HONEYCOMB 1-2 1
  Skills:
    - command{c="points give <trigger.name> 1 -s";sender=console} @self ~onDeath
    - actionmessage{m="<#34B0F3>+1 <white>Alma <#34B0F3>🔥 &8| <#59E91F>+<#59E91F>&l$&r<#59E91F>1000"} @trigger ~onDeath
    - command{c="economy give <trigger.name> 1000 -s";sender=console} @self ~onDeath
    - particles{particle=SCULK_SOUL;amount=50;speed=0.1;hSpread=0.5;vSpread=0.5} @self ~onDeath
    - command{c="si give fragmentosuper 1 <trigger.name> -s";sender=console} @self ~onDamaged  0.3
    - heal{amount=-1} @self ~onDamaged
    - skill{s=InvocarAbejas} @self ~onTimer:300
    - lightning @PlayersInRadius{r=20} ~onTimer:150

    - skill{s=BoostAlmas} @self ~onDeath 
    - setvariable{var=almas;value=1;scope=CASTER;type=INTEGER} @self ~onSpawn
