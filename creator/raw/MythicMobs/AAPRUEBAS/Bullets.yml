# Lerfing's bullet pack. These are for magic attacks of anything you can think of. 
# Includes ice, lightning, fire, earth, void, floating weapons, mist, and more. 
# Meant to be used from a boss / mob casting a skill with the - summon mechanic. 
# Basically a boss summons these bullet mobs in patterns to create any type of
# Attack you can think of, and can manipulate their position too.
# Check out this video for a huge showcase https://youtu.be/CEqFDDcC960?si=5PqzYExXjgO16g4B
# Also check out my mythicmobs tutorial to see how to use these!

#There are premade skills using these bullet mobs. If you are
#not making your own skills, ignore this file.

#To change damage values of the attack, type ctrl+f then search "- damage" and change the amount
#to whatever you want.

#The base for all bullets. Copy paste this code if you want to make your own bullet effects!
Test_Bullet:
  Type: SILVERFISH
  Display: '&5Debug Bullet'
  Health: 10
  Damage: 0
  DamageModifiers:
  - FALL 0
  Options:
    FollowRange: 48
    MovementSpeed: 0.1
    KnockbackResistance: 1.0
    Collidable: false
    Invisible: true
    PreventMobKillDrops: true
    PreventOtherDrops: true
    PreventRandomEquipment: true
    PreventSunburn: true
    NoGravity: true
    Silent: true
    Invincible: true
  AIGoalSelectors:
  - clear
  - meleeattack
  Skills:
  - damage{a=2;pkb=true} @PIR{r=3} ~onTimer:5
  - effect:particles{particle=block_crack;material=dirt;hs=0.5;vs=0.5;a=30} @self ~onTimer:2
  - remove{delay=200} @self ~onSpawn

