modificado:
  Type: PILLAGER
  Display: '&f[Lv.100] &bWAZAAA &8| <#ED1313><caster.hp{r=0}><&heart>'
  Health: 70
  Damage: 60
  Options:
    Scale: 1.3
    MovementSpeed: 0.6
    PreventOtherDrops: true
    Despawn: false
    ReturnHome: true
    LeashRange: 20
    KnockbackResistance: 0.5
    PreventSunburn: true
  Modules:
    ThreatTable: true
  Equipment:
    - IRON_AXE HAND
    - SHIELD OFFHAND
  AIGoalSelectors:
    - 0 clear
    - 1 meleeattack
    - 2 randomstroll
    - 3 lookatplayers
    - 4 float
  AITargetSelectors:
    - 0 clear
    - 1 players
  Drops:
    - EMERALD 1-2 0.5
    - DIAMOND 1-2 1
    - EXPERIENCE_BOTTLE 1-2 1
  Skills:
    - particles{particle=SNOWFLAKE;amount=20;speed=0.05;hSpread=1.5;vSpread=1.5} @self ~onTimer:10

    - skill{s=SonidoKill} @trigger ~onDeath
    - setname{n=<caster.name>;delay=2} @self ~onDamaged
    - particles{particle=SCULK_SOUL;amount=60;speed=0.1;hSpread=0.6;vSpread=0.6} @self ~onDeath
    ####### RECOMPENSAS #######
    - actionmessage{m="<#34B0F3>+5 <white>Almas <#34B0F3>🔥 &8| <#59E91F>+<#59E91F>&l$&r<#59E91F>50"} @trigger ~onDeath  
    - command{c="points give <trigger.name> 5 -s";sender=console} @self ~onDeath  
    - command{c="economy give <trigger.name> 50";sender=console} @self ~onDeath   
    - command{c="si give fragmentosuper 1 <trigger.name> -s";sender=console} @self ~onDeath 0.02 
    - command{c="si give fragmentorara 1 <trigger.name> -s";sender=console} @self ~onDeath 0.02 
    - command{c="si give fragmentogadget 1 <trigger.name> -s";sender=console} @self ~onDeath 0.02 
    - command{c="si give fragmentomitica 1 <trigger.name> -s";sender=console} @self ~onDeath 0.003 
    ####### EXTRAS #######
    - skill{s=DropFragmentoLimitedGeneral} @self ~onDeath 0.001
    - skill{s=BoostAlmas} @self ~onDeath 
    - setvariable{var=almas;value=5;scope=CASTER;type=INTEGER} @self ~onSpawn
    

modificado2:
  Type: HOGLIN
  Display: '&cLvl 100 &8| &fʙᴇꜱᴛɪᴀ ʜᴏɢʟɪɴ &8| <#ED1313><caster.hp{r=0}><&heart>'
  Health: 60
  Damage: 30
  Options:
    ImmuneToZombification: true
    Scale: 0.8
    MovementSpeed: 0.3
    PreventOtherDrops: true
    LeashRange: 14
    FollowRange: 10
    Despawn: false
    ReturnHome: true
    Silent: false
  AIGoalSelectors:
    - 0 clear
    - 1 meleeattack
    - 2 randomstroll
    - 3 lookatplayers
    - 4 float
  AITargetSelectors:
    - 0 clear
    - 1 players
  Drops:
    - GOLD_NUGGET 3-8 1
    - GOLD_INGOT 1-2 0.3
    - EXPERIENCE_BOTTLE 1-3 0.7
  Skills:
    ####### VISUAL #######
    - skill{s=SonidoKill} @trigger ~onDeath
    - setname{n=<caster.name>;delay=2} @self ~onDamaged
    - particles{particle=SCULK_SOUL;amount=60;speed=0.1;hSpread=0.6;vSpread=0.6} @self ~onDeath
    ####### RECOMPENSAS #######
    - actionmessage{m="<#34B0F3>+4 <white>Almas <#34B0F3>🔥 &8| <#59E91F>+<#59E91F>&l$&r<#59E91F>45"} @trigger ~onDeath  
    - command{c="points give <trigger.name> 4 -s";sender=console} @self ~onDeath  
    - command{c="economy give <trigger.name> 45";sender=console} @self ~onDeath    
    - command{c="si give fragmentosuper 1 <trigger.name> -s";sender=console} @self ~onDeath 0.02 
    - command{c="si give fragmentorara 1 <trigger.name> -s";sender=console} @self ~onDeath 0.02 
    - command{c="si give fragmentogadget 1 <trigger.name> -s";sender=console} @self ~onDeath 0.02 
    - command{c="si give fragmentomitica 1 <trigger.name> -s";sender=console} @self ~onDeath 0.003 
    ####### EXTRAS #######
    # Aura de debilitamiento al 50% HP — el jugador nota que algo cambia
    - skill{s=DropFragmentoLimitedGeneral} @self ~onDeath 0.001
    - skill{s=BoostAlmas} @self ~onDeath 
    - setvariable{var=almas;value=4;scope=CASTER;type=INTEGER} @self ~onSpawn